:root{
  --navy:#262262;          /* ASA primary */
  --navy-2:#3a3680;
  --grey:#E2E2E2;          /* ASA secondary */
  --bg:#F3F3F5;
  --card:#FFFFFF;
  --ink:#1C1B3A;
  --muted:#6E6D88;
  --line:#E2E2E2;
  --soft:#F6F6F9;
  --danger:#B42318;
  --ok:#1F7A4D;
  --radius:14px;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

AAAAgABTBwAAAAAAIMDUAQAAAAAACDB1AAAAAAAAAkwdAAAAAACAAFMHAAAAAAAgwNQBAAAAAAAIWDOzf0cAAAAAAADwdC7ilETfp+1vSQAAAABJRU5ErkJggg==) no-repeat;background-size:104px 104px;background-position:-26px -33px}
.brand{line-height:1}
.brand b{display:block;font:400 26px/1 var(--display);letter-spacing:.04em;color:#fff}
.brand small{font:400 13px/1 var(--display);letter-spacing:.12em;color:var(--grey);opacity:.75}
.top-actions{margin-left:auto;display:flex;gap:6px}
.ghost{background:transparent;border:1px solid rgba(226,226,226,.28);color:var(--grey);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500}
.ghost:hover{background:rgba(255,255,255,.08)}

main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}

/* ---------- List view ---------- */
.list-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.list-head h1{font:400 30px/1 var(--display);letter-spacing:.03em;margin:0;color:var(--navy)}
.count{color:var(--muted);font-size:13px;margin-top:2px}
.search{margin-left:auto;min-width:0;flex:0 1 240px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
.search:focus,.in:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;height:40px;padding:0 16px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.btn:hover{background:var(--navy-2)}
.btn.light{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.btn.light:hover{background:var(--soft)}

.ship-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.ship-cols,.ship-row{display:grid;grid-template-columns:1fr 190px 130px;gap:16px;align-items:center;padding:0 20px}
.ship-cols{height:40px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.ship-row{min-height:64px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.ship-row:last-child{border-bottom:0}
.ship-row:hover{background:var(--soft)}
.ship-row:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.r-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-name.empty{color:var(--muted);font-weight:500;font-style:italic}
.r-amt{text-align:right;font-weight:600;font-size:16px}
.r-amt small{font-weight:500;color:var(--muted);font-size:12px;margin-right:4px}
.r-date{text-align:right;color:var(--muted)}
.ship-cols .ra{text-align:right}
.empty-state{padding:56px 20px;text-align:center;color:var(--muted)}
.empty-state b{display:block;font:400 26px/1 var(--display);letter-spacing:.04em;color:var(--navy);margin-bottom:8px}

/* ---------- Detail view ---------- */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--navy);font-weight:600;margin-bottom:12px}
.back:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font:400 20px/1 var(--display);letter-spacing:.06em;color:var(--navy);margin:0 0 14px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.in{width:100%;height:42px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:0 12px}
.in:disabled{background:#ECECEF;color:#A3A2B5}
.in.title{height:54px;font:400 30px/1 var(--display);letter-spacing:.03em;background:transparent;border-color:transparent;padding:0 10px;margin-left:-10px;width:calc(100% + 10px)}
.in.title:hover{border-color:var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:14px}
.bar .spacer{flex:1}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.fx{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.fx .in{width:96px;height:36px;text-align:right}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;user-select:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:40px;height:23px;border-radius:99px;background:#CFCFD8;position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--navy)}
.switch input:checked + .track::after{transform:translateX(17px)}
.switch input:focus-visible + .track{outline:2px solid var(--navy);outline-offset:2px}

.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 8px;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
td .in{height:38px;background:transparent;border-color:transparent;padding:0 8px}
td .in:hover:not(:disabled){border-color:var(--line);background:var(--soft)}
td .in.r{text-align:right}
td .in[data-f="item"]{min-width:210px}
td.idx{color:var(--muted);width:28px;font-size:13px}
td.calc{font-weight:600;white-space:nowrap;padding-right:10px}
td.calc.hl{color:var(--navy)}
.col-kg.off{background:repeating-linear-gradient(135deg,#EFEFF3 0 6px,#F7F7FA 6px 12px)}
.col-kg.off .in{background:transparent;color:#B5B4C4}
th.col-kg.off{background:none;color:#B5B4C4}
.x{border:0;background:none;color:#B5B4C4;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:#FBEAE8;color:var(--danger)}
.add-row{margin-top:10px;background:none;border:1px dashed #C9C8D6;border-radius:10px;height:40px;width:100%;color:var(--navy);font-weight:600}
.add-row:hover{background:var(--soft);border-color:var(--navy)}
.mat-total{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mat-total .k{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.mat-total .v{font-size:20px;font-weight:600}
.mat-total .eq{color:var(--muted);font-size:14px}

.ship-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ship-in .in{max-width:240px;text-align:right;font-size:17px;font-weight:600}
.ship-in .eq{color:var(--muted);font-size:14px}

.summary{background:var(--navy);color:var(--grey);border:0}
.summary h2{color:#fff}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:18px;align-items:end}
.summary .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.sum-grid .v{font-size:20px;font-weight:600;color:#fff}
.sum-grid .big .v{font:400 44px/1 var(--display);letter-spacing:.02em}
.sum-grid .big .v small{font-size:22px;opacity:.75;margin-right:6px}
.kg-line{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid rgba(226,226,226,.2)}
.kg-line .v{font:400 30px/1 var(--display);letter-spacing:.02em;color:#fff}
.kg-line .v small{font-size:16px;opacity:.75;margin-left:4px}
.note{font-size:13px;opacity:.75;margin-top:12px}
.kg-calc{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.07);font-size:14px;line-height:1.9}
.kg-calc .step{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kg-calc .step b{color:#fff;font-weight:600}
.kg-calc .step.tot{border-top:1px solid rgba(226,226,226,.2);margin-top:4px;padding-top:4px}
.warn{color:#FFD58A}

.foot-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.danger{background:none;border:1px solid #E7C3BF;color:var(--danger);border-radius:10px;height:40px;padding:0 16px;font-weight:600}
.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.saved{font-size:13px;color:var(--muted);align-self:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}

/* ---------- Bills & explanation ---------- */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stl-sub{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.doc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.doc-head .lbl{margin:0}
.doc-head .cnt{font-size:12px;color:var(--muted)}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 8px 8px 10px;margin-bottom:8px}
.ficon{flex:none;width:34px;height:40px;border-radius:6px;background:var(--navy);color:#fff;font:400 13px/40px var(--display);letter-spacing:.05em;text-align:center}
.ficon.txt{background:#6E6D88}
.fmeta{min-width:0;flex:1}
.fname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-size:12px;color:var(--muted)}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:32px;padding:0 10px;font-size:13px;font-weight:600;color:var(--navy)}
.fbtn:hover{border-color:var(--navy)}
.attach{width:100%;height:58px;border:1px dashed #C9C8D6;border-radius:10px;background:none;color:var(--navy);font-weight:600;font-size:14px}
.attach:hover,.attach.drag{background:var(--soft);border-color:var(--navy)}
.attach small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.explain-text{display:block;width:100%;min-height:140px;resize:vertical;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0;overflow:hidden;font:400 14px/1.55 var(--body);color:var(--ink)}
.explain-text:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent;background:var(--card)}
.explain-hint{font-size:12px;color:var(--muted);margin-top:6px}
.or-write{display:block;margin:10px auto 0;background:none;border:0;color:var(--navy);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

@media (max-width:720px){
  .ship-cols{display:none}
  .ship-row{grid-template-columns:1fr auto;grid-template-areas:"n a" "d a";row-gap:2px;padding:12px 16px}
  .r-name{grid-area:n}.r-amt{grid-area:a}.r-date{grid-area:d;text-align:left;font-size:13px}
  .search{flex:1 1 100%;order:3;margin-left:0}
  .grid3{grid-template-columns:1fr}
  .sum-grid{grid-template-columns:1fr 1fr}
  .sum-grid .big{grid-column:1/-1}
  .card{padding:16px}
  .tbl-wrap{margin:0 -16px;padding:0 16px}
  .top-actions .ghost{padding:7px 9px}
  .brand small{display:none}
  .docs{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  .top-actions,.back,.add-row,.x,.foot-actions,.toast,.attach,.fbtn{display:none!important}
  .explain-text{resize:none;background:#fff}
  .explain-hint,.or-write{display:none!important}
  .card{break-inside:avoid;border-color:#ccc}
  .summary{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl-wrap{overflow:visible}
  table{min-width:0}
  @page{size:A4;margin:12mm}
}
</style>

<body>
<header class="top">
  <div class="top-in">
    <a class="asa-home" href="../../index.html" title="Back to ASA Apps">&larr; ASA Home</a>
    <div class="logo" role="img" aria-label="ASA"></div>
    <div class="brand"><b>Stock Costing</b><small>Al Sahlawi Aluminum L.L.C</small></div>
    <div class="top-actions">
      <button class="ghost" id="btnBackup" title="Download a backup file of all shipments">Backup</button>
      <button class="ghost" id="btnRestore" title="Load shipments from a backup file">Restore</button>
      <input type="file" id="fileRestore" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<main>
  <!-- LIST -->
  <section id="viewList">
    <div class="list-head">
      <div>
        <h1>Shipments</h1>
        <div class="count" id="count"></div>
      </div>
      <input class="search" id="search" type="search" placeholder="Search material, supplier, shipper">
      <button class="btn" id="btnNew">+ New shipment</button>
    </div>
    <div class="ship-list" id="shipList"></div>
  </section>

  <!-- DETAIL -->
  <section id="viewDetail" hidden>
    <button class="back" id="btnBack">&#8249; All shipments</button>

    <div class="card">
      <input class="in title" id="fMaterial" placeholder="Name of the material" autocomplete="off">
      <div class="grid3">
        <div><label class="lbl" for="fSupplier">Supplier</label><input class="in" id="fSupplier" placeholder="Supplier name" autocomplete="off"></div>
        <div><label class="lbl" for="fShipper">Shipper</label><input class="in" id="fShipper" placeholder="Shipper / forwarder" autocomplete="off"></div>
        <div><label class="lbl" for="fArrival">Date of arrival</label><input class="in" id="fArrival" type="date"></div>
      </div>
    </div>

    <div class="card">
      <h2>Materials</h2>

        <label class="fx" id="fxWrap">1 USD = <input class="in num" id="fFx" inputmode="decimal"> AED</label>

          <thead><tr id="thead"></tr></thead>
          <tbody id="rows"></tbody>
        </table>

      <div class="mat-total">
        <span class="k">Material total</span>

      <h2>Landed cost</h2>

        <div><div class="k">Material</div><div class="v num" id="oSumMat"></div></div>
        <div><div class="k">Shipping</div><div class="v num" id="oSumShip"></div></div>
        <div class="big"><div class="k">ASA total</div><div class="v num" id="oSumAsa"></div></div>
      </div>
      <div class="kg-line" id="kgLine">
        <div><div class="k">Total weight</div><div class="v num" id="oKg"></div></div>
        <div><div class="k">Price (before shipping)</div><div class="v num" id="oMatKg"></div></div>
        <div><div class="k">Landed price</div><div class="v num" id="oAvgKg"></div></div>
      </div>
      <div class="kg-calc num" id="oKgCalc"></div>

      <h2>Bills</h2>
      <div class="docs">
        <div>
          <div class="doc-head"><span class="lbl">Supplier bill</span><span class="cnt">PDF</span></div>

        <div>
          <div class="doc-head"><span class="lbl">Shipper bills</span><span class="cnt" id="shipperCount"></span></div>
          <div id="shipperBills"></div>

        <div class="doc-head"><span class="lbl">STL payments</span><span class="cnt" id="stlCount"></span></div>
        <div id="stlFiles"></div>

      <h2>Explanation</h2>
      <div id="explain"></div>
    </div>
    <input type="file" id="pickSupplier" accept="application/pdf,.pdf" hidden>
    <input type="file" id="pickShipper" accept="application/pdf,.pdf" multiple hidden>
    <input type="file" id="pickExplain" accept="text/plain,.txt" hidden>

    <div class="foot-actions">
      <button class="danger" id="btnDelete">Delete shipment</button>
      <span class="saved" id="saved"></span>
      <button class="btn light" id="btnPrint">Print / PDF</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   ASA Stock Costing
   Landed cost = material value + shipping, shipping split
   across rows by value. All totals shown in AED.
   ========================================================= */

const FX_DEFAULT = 3.685;    // USD -> AED rate used by ASA
const MAX_SHIPPER_BILLS = 3;

/* ---------- Storage ----------
   Shipment data goes through Store, PDF bills through FileStore.
   To move online later (e.g. Firebase + Firebase Storage),
   replace these two objects only. */
const Store = {
  key: 'asa_stock_costing_v1',
  load(){
    try{ const raw = localStorage.getItem(this.key); const d = raw ? JSON.parse(raw) : []; return Array.isArray(d) ? d : []; }
    catch(e){ return []; }
  },
  save(list){
    try{ localStorage.setItem(this.key, JSON.stringify(list)); return true; }
    catch(e){ toast('Could not save on this device'); return false; }
  }
};

/* PDFs are too big for localStorage, so they live in IndexedDB keyed by file id */
const FileStore = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('asa_stock_costing_files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async _tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('files', mode); const req = fn(tx.objectStore('files'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  put(id, blob){ return this._tx('readwrite', st => st.put(blob, id)); },
  get(id){ return this._tx('readonly', st => st.get(id)); },
  del(id){ return this._tx('readwrite', st => st.delete(id)); }
};


/* ---------- ASA: approved devices + shared cloud ----------
   Opening needs the person's name + password and an admin-approved device
   (shared/asa-device-gate.js, its own list: "Stock Costing devices").
   Store and FileStore keep working on this device; these wrappers also share
   them through apps/sc-<key>/:
     shipments/{id}             one record per shipment (newest `updated` wins)
     files/{id} + pdf/{id}_{n}  the PDF bills, in pieces; downloaded when first opened */
let CS = { cloud:false, vault:'', admin:false, applying:false };
const CS_OUTBOX = 'asa_costing_outbox', CS_CHUNK = 900000;
let csSent = new Map();                        // shipment id -> JSON last sent/received
const csTag = () => ({ dev: ASACloud.deviceId(), by: ASACloud.name(), ts: Date.now() });
const csStrip = d => { const o = { ...d }; ['dev','by','ts','_by','_device','_at','deleted'].forEach(k => delete o[k]); return o; };
const csB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(b); });

const _save = Store.save.bind(Store);
const _fput = FileStore.put.bind(FileStore), _fget = FileStore.get.bind(FileStore), _fdel = FileStore.del.bind(FileStore);

function csQueue(job){
  let box = {}; try { box = JSON.parse(localStorage.getItem(CS_OUTBOX) || '{}'); } catch(e){}
  box[job.kind + ':' + job.id] = job; localStorage.setItem(CS_OUTBOX, JSON.stringify(box));
}
async function csSend(job){
  try{
    if (job.kind === 'ship'){
      const s = DB.find(x => x.id === job.id);
      if (s) await ASACloud.put(CS.vault, 'shipments', s.id, { ...JSON.parse(JSON.stringify(s)), ...csTag() });
    } else if (job.kind === 'shipDel'){
      await ASACloud.put(CS.vault, 'shipments', job.id, { id: job.id, deleted: true, updated: Date.now(), ...csTag() });
    } else if (job.kind === 'file'){
      const blob = await _fget(job.id);
      if (blob){
        const b64 = await csB64(blob), n = Math.max(1, Math.ceil(b64.length / CS_CHUNK));
        for (let i = 0; i < n; i++) await ASACloud.put(CS.vault, 'pdf', job.id + '_' + i, { data: b64.slice(i * CS_CHUNK, (i + 1) * CS_CHUNK), ...csTag() });
        await ASACloud.put(CS.vault, 'files', job.id, { type: blob.type || 'application/pdf', chunks: n, size: blob.size, ...csTag() });
      }
    } else if (job.kind === 'fileDel'){
      await ASACloud.put(CS.vault, 'files', job.id, { deleted: true, ...csTag() });
    }
  }catch(e){
    csQueue(job);
    if (String(e && e.code).includes('permission-denied')) toast('The cloud refused this change — is this device still approved?');
  }
}
async function csFlush(){
  let box = {}; try { box = JSON.parse(localStorage.getItem(CS_OUTBOX) || '{}'); } catch(e){}
  localStorage.removeItem(CS_OUTBOX);
  for (const j of Object.values(box)) await csSend(j);
}

/* every save sends only the shipments that changed */
Store.save = function(list){
  const ok = _save(list);
  if (ok && CS.cloud && !CS.applying){
    const now = new Map();
    for (const s of list){
      const js = JSON.stringify(s); now.set(s.id, js);
      if (csSent.get(s.id) !== js) csSend({ kind:'ship', id:s.id });
    }
    for (const id of csSent.keys()) if (!now.has(id)) csSend({ kind:'shipDel', id });
    csSent = now;
    const el = document.getElementById('saved'); if (el) el.textContent = 'Saved · shared with the team';
  }
  return ok;
};
FileStore.put = async function(id, blob){ await _fput(id, blob); if (CS.cloud) csSend({ kind:'file', id }); };
FileStore.del = async function(id){ await _fdel(id); if (CS.cloud) csSend({ kind:'fileDel', id }); };
FileStore.get = async function(id){
  const here = await _fget(id);
  if (here || !CS.cloud) return here;
  const meta = await ASACloud.get(CS.vault, 'files', id);
  if (!meta || meta.deleted) return undefined;
  toast('Downloading bill…');
  const parts = await Promise.all(Array.from({ length: meta.chunks || 1 }, (_, i) => ASACloud.get(CS.vault, 'pdf', id + '_' + i)));
  if (parts.some(p => !p)) throw new Error('Part of this PDF is missing in the cloud');
  const bin = Uint8Array.from(atob(parts.map(p => p.data).join('')), c => c.charCodeAt(0));
  const blob = new Blob([bin], { type: meta.type || 'application/pdf' });
  await _fput(id, blob);
  return blob;
};

function csApply(){ CS.applying = true; try { _save(DB); } finally { CS.applying = false; } }

/* merge this device and the cloud: newest version of each shipment wins */
async function csSyncAll(){
  await csFlush();
  const cloud = await ASACloud.list(CS.vault, 'shipments');
  const local = new Map(DB.map(s => [s.id, s]));
  const push = [];
  csSent = new Map();
  for (const c of cloud){
    const l = local.get(c.id);
    local.delete(c.id);
    if (c.deleted){ if (l) DB = DB.filter(s => s.id !== c.id); continue; }
    const remote = csStrip(c);
    if (!l || (remote.updated || 0) > (l.updated || 0)){
      if (l) DB[DB.indexOf(l)] = remote; else DB.push(remote);
      csSent.set(c.id, JSON.stringify(remote));
    } else { csSent.set(c.id, JSON.stringify(remote)); if ((l.updated || 0) > (remote.updated || 0)) push.push(l.id); }
  }
  const onlyHere = [...local.values()];
  csApply();
  for (const id of push) csSend({ kind:'ship', id });
  for (const s of onlyHere){
    await csSend({ kind:'ship', id:s.id }); csSent.set(s.id, JSON.stringify(s));
    for (const fid of docIds(s)) await csSend({ kind:'file', id:fid });
  }
  if (onlyHere.length) toast(`Shared ${onlyHere.length} shipment(s) from this device`);
  route();
}

function csLive(){
  ASACloud.watch(CS.vault, 'shipments', Date.now() - 10 * 60 * 1000, changes => {
    let touched = false, who = '';
    for (const c of changes){
      if (c.data.dev === ASACloud.deviceId()) continue;
      const i = DB.findIndex(s => s.id === c.id);
      // Someone is typing in this shipment right now — don't pull the form out from under them.
      if (current && current.id === c.id){ toast(`${c.data.by || 'Someone'} also changed this shipment — the newest save wins`); continue; }
      if (c.type === 'removed' || c.data.deleted){ if (i >= 0){ DB.splice(i, 1); touched = true; } csSent.delete(c.id); continue; }
      const remote = csStrip({ ...c.data, id: c.id });
      if (i < 0 || (remote.updated || 0) >= (DB[i].updated || 0)){
        if (i < 0) DB.push(remote); else DB[i] = remote;
        csSent.set(c.id, JSON.stringify(remote)); touched = true; who = c.data.by || who;
      }
    }
    if (!touched) return;
    csApply();
    if (!current) renderList();
    if (who) toast('Shipments updated by ' + who);
  }).catch(() => {});
}

ASADeviceGate.open({ tool:'costing', prefix:'sc', title:'Stock Costing' }).then(async ctx => {
  CS = { ...CS, ...ctx };
  if (!CS.cloud) return;
  try { await csSyncAll(); csLive(); }
  catch(e){ toast('Working offline — changes will sync later'); }
});

let DB = Store.load();
let current = null;          // shipment open in the detail view

/* older shipments: add the docs block; move the old default rate to 3.685 */
DB.forEach(s => {
  if(!s.docs) s.docs = {supplier:null, shipper:[], explain:null};
  if(!s.docs.stl) s.docs.stl = [];
  if(+s.fx === 3.6725) s.fx = FX_DEFAULT;
});

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmt = (n, d=2) => (isFinite(n) ? n : 0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = (n, cur='AED') => cur + ' ' + fmt(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDate = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d} ${MONTHS[+m-1]} ${y}`; };
/* show a stored number in an input without float noise */
const show = v => (v === '' || v == null) ? '' : String(+(+v).toFixed(6));

let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200); }

function newRow(){ return {id:uid(), item:'', qty:'', kg:'', price:'', total:''}; }
function newShipment(){
  return {id:uid(), material:'', supplier:'', shipper:'', arrival:today(),
          cur:'USD', fx:FX_DEFAULT, useKg:false, rows:[newRow()],
          ship:'', shipCur:'AED', docs:{supplier:null, shipper:[], stl:[], explain:null},
          created:Date.now(), updated:Date.now()};
}

/* ---------- Costing ---------- */
function rateFor(s, cur){ return cur === 'USD' ? (num(s.fx) || FX_DEFAULT) : 1; }

function calc(s){
  const r = rateFor(s, s.cur);
  const rows = s.rows.map(x => {
    const qty = num(x.qty), kg = num(x.kg), total = num(x.total);
    return {qty, kg, total, aed: total * r};
  });
  const matTotal = rows.reduce((a,x)=>a+x.total, 0);
  const matAED   = rows.reduce((a,x)=>a+x.aed, 0);
  const shipAED  = num(s.ship) * rateFor(s, s.shipCur);

  // shipping split by value
  rows.forEach(x => {
    x.share  = matAED > 0 ? x.aed / matAED : 0;
    x.landed = x.aed + shipAED * x.share;
    x.perPc  = x.qty > 0 ? x.landed / x.qty : null;
    x.perKg  = x.kg  > 0 ? x.landed / x.kg  : null;   // incl. shipping
    x.matKg  = x.kg  > 0 ? x.aed / x.kg     : null;   // price only
  });

  const kgRows  = rows.filter(x => x.kg > 0);
  const totalKg = kgRows.reduce((a,x)=>a+x.kg, 0);
  const avgKg    = totalKg > 0 ? kgRows.reduce((a,x)=>a+x.landed, 0) / totalKg : null;
  const avgMatKg = totalKg > 0 ? kgRows.reduce((a,x)=>a+x.aed, 0) / totalKg : null;
  const missingKg = rows.filter(x => x.total > 0 && !(x.kg > 0)).length;

  return {rows, matTotal, matAED, shipAED, asa: matAED + shipAED, totalKg, avgKg, avgMatKg, missingKg};
}

/* ---------- Persist ---------- */
let saveT;
function touch(){
  if(!current) return;
  current.updated = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ if(Store.save(DB)) $('saved').textContent = 'Saved on this device'; }, 250);
}
function isBlank(s){
  const d = s.docs || {};
  return !s.material.trim() && !s.supplier.trim() && !s.shipper.trim() && !num(s.ship) &&
         !d.supplier && !(d.shipper||[]).length && !(d.stl||[]).length && !(d.explain && d.explain.text.trim()) &&
         s.rows.every(r => !String(r.item).trim() && !num(r.qty) && !num(r.total));
}

/* ---------- List view ---------- */
function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const all = [...DB].sort((a,b) => (b.arrival||'').localeCompare(a.arrival||'') || b.created - a.created);
  const list = q ? all.filter(s => [s.material,s.supplier,s.shipper].join(' ').toLowerCase().includes(q)) : all;

  $('count').textContent = DB.length ? `${DB.length} shipment${DB.length>1?'s':''}` : '';
  const box = $('shipList');

  if(!DB.length){
    box.innerHTML = `<div class="empty-state"><b>No shipments yet</b>Click “+ New shipment” to cost your first arrival.</div>`;
    return;
  }
  if(!list.length){
    box.innerHTML = `<div class="empty-state">Nothing matches “${esc(q)}”.</div>`;
    return;
  }
  box.innerHTML =
    `<div class="ship-cols"><span>Material</span><span class="ra">ASA total</span><span class="ra">Date of arrival</span></div>` +
    list.map(s => {
      const c = calc(s);
      const name = s.material.trim();
      return `<button class="ship-row" data-id="${esc(s.id)}">
        <span class="r-name${name?'':' empty'}">${name ? esc(name) : 'Untitled material'}</span>
        <span class="r-amt num"><small>AED</small>${fmt(c.asa)}</span>
        <span class="r-date num">${niceDate(s.arrival)}</span>
      </button>`;
    }).join('');
}

$('shipList').addEventListener('click', e => {
  const row = e.target.closest('.ship-row');
  if(row) location.hash = '#/s/' + row.dataset.id;
});
$('search').addEventListener('input', renderList);
$('btnNew').addEventListener('click', () => {
  const s = newShipment(); DB.push(s); Store.save(DB);
  location.hash = '#/s/' + s.id;
  setTimeout(()=>$('fMaterial').focus(), 30);
});

/* ---------- Detail view ---------- */
function setSeg(el, v){ el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }

function openDetail(s){
  current = s;
  $('fMaterial').value = s.material;
  $('fSupplier').value = s.supplier;
  $('fShipper').value  = s.shipper;
  $('fArrival').value  = s.arrival || '';
  $('fFx').value       = show(s.fx);
  $('fKg').checked     = !!s.useKg;
  $('fShip').value     = show(s.ship);
  setSeg($('segCur'), s.cur);
  setSeg($('segShip'), s.shipCur);
  $('saved').textContent = '';
  disarmDelete();
  renderTable();
  renderDocs();
}

function renderTable(){
  const s = current, cur = s.cur;
  const del = `<td style="width:36px"><button class="x" data-del title="Remove row" aria-label="Remove row">&times;</button></td>`;
  const item = r => `<td><input class="in" data-f="item" value="${esc(r.item)}" placeholder="e.g. Sheet 1.5mm 1220×2440" autocomplete="off"></td>`;
  const total = r => `<td style="width:150px"><input class="in r num" data-f="total" inputmode="decimal" value="${esc(show(r.total))}" placeholder="0.00"></td>`;

  if(s.useKg){
    /* Aluminium sheets: total weight + total price -> AED/kg */
    $('thead').innerHTML =
      `<th></th><th>Item / description</th><th class="r">Total weight (kg)</th><th class="r">Total price (${cur})</th>` +
      `<th class="r">AED / kg</th><th class="r">Landed AED / kg</th><th></th>`;
    $('rows').innerHTML = s.rows.map((r,i) => `
      <tr data-id="${esc(r.id)}">
        <td class="idx">${i+1}</td>${item(r)}
        <td style="width:150px"><input class="in r num" data-f="kg" inputmode="decimal" value="${esc(show(r.kg))}" placeholder="0"></td>
        ${total(r)}
        <td class="r calc num" data-o="matKg"></td>
        <td class="r calc hl num" data-o="perKg"></td>
        ${del}
      </tr>`).join('');
  } else {
    $('thead').innerHTML =
      `<th></th><th>Item / description</th><th class="r">Qty</th>` +
      `<th class="r col-kg off">Weight (kg)</th>` +
      `<th class="r">Unit price (${cur})</th><th class="r">Total (${cur})</th>` +
      `<th class="r">Landed / pc (AED)</th><th></th>`;
    $('rows').innerHTML = s.rows.map((r,i) => `
      <tr data-id="${esc(r.id)}">
        <td class="idx">${i+1}</td>${item(r)}
        <td style="width:90px"><input class="in r num" data-f="qty" inputmode="decimal" value="${esc(show(r.qty))}" placeholder="0"></td>
        <td class="col-kg off" style="width:110px"><input class="in r num" data-f="kg" value="${esc(show(r.kg))}" placeholder="—" disabled></td>
        <td style="width:130px"><input class="in r num" data-f="price" inputmode="decimal" value="${esc(show(r.price))}" placeholder="0.00"></td>
        ${total(r)}
        <td class="r calc hl num" data-o="perPc"></td>
        ${del}
      </tr>`).join('');
  }
  refresh();
}

/* Update computed numbers only (keeps typing focus) */
function refresh(){
  const s = current; if(!s) return;
  const c = calc(s);
  const isUSD = s.cur === 'USD';

  $('fxWrap').hidden = !(isUSD || s.shipCur === 'USD');
  [...$('rows').children].forEach((tr,i) => {
    const x = c.rows[i]; if(!x) return;
    const put = (k, v) => { const el = tr.querySelector(`[data-o="${k}"]`); if(el) el.textContent = v != null && x.total > 0 ? fmt(v) : '—'; };
    put('perPc', x.perPc);
    put('matKg', x.matKg);
    put('perKg', x.perKg);
  });

  $('oMat').textContent   = money(c.matTotal, s.cur);
  $('oMatEq').textContent = isUSD ? '= ' + money(c.matAED) : '';
  $('oShipEq').textContent = s.shipCur === 'USD' && num(s.ship) ? '= ' + money(c.shipAED) : '';

  $('oSumMat').textContent  = money(c.matAED);
  $('oSumShip').textContent = money(c.shipAED);
  $('oSumAsa').innerHTML    = `<small>AED</small>${fmt(c.asa)}`;

  $('kgLine').hidden = !s.useKg;
  $('oKg').innerHTML    = `${fmt(c.totalKg)}<small>kg</small>`;
  $('oMatKg').innerHTML = c.avgMatKg != null ? `${fmt(c.avgMatKg)}<small>AED / kg</small>` : '—';
  $('oAvgKg').innerHTML = c.avgKg != null ? `${fmt(c.avgKg)}<small>AED / kg</small>` : '—';

  /* sheets: show the working step by step */
  const kc = $('oKgCalc');
  kc.hidden = !(s.useKg && c.totalKg > 0);
  if(!kc.hidden){
    const kgAED = c.rows.filter(x => x.kg > 0).reduce((a,x)=>a+x.aed, 0);
    const priceTxt = isUSD ? `${money(kgAED / rateFor(s,'USD'), 'USD')} × ${show(rateFor(s,'USD'))} = ${money(kgAED)}` : money(kgAED);
    const shipKg = c.rows.filter(x => x.kg > 0).reduce((a,x)=>a+(x.landed-x.aed), 0);
    kc.innerHTML =
      `<div class="step"><span>Total price</span><b>${priceTxt}</b></div>` +
      `<div class="step"><span>÷ Total weight ${fmt(c.totalKg)} kg</span><b>${fmt(c.avgMatKg)} AED/kg</b></div>` +
      `<div class="step"><span>+ Shipping</span><b>${money(shipKg)}</b></div>` +
      `<div class="step tot"><span>(${money(kgAED + shipKg)}) ÷ ${fmt(c.totalKg)} kg = Landed</span><b>${fmt(c.avgKg)} AED/kg</b></div>`;
  }

  const notes = [];
  if(c.matAED > 0 && c.shipAED > 0) notes.push(`Shipping adds ${fmt(c.shipAED / c.matAED * 100, 1)}% on top of material value, split across rows by value.`);
  if(s.useKg && c.missingKg) notes.push(`<span class="warn">${c.missingKg} row${c.missingKg>1?'s have':' has'} no weight, so ${c.missingKg>1?'they are':'it is'} left out of the average per kg.</span>`);
  $('oNote').innerHTML = notes.join(' ');
}

/* header fields */
[['fMaterial','material'],['fSupplier','supplier'],['fShipper','shipper'],['fArrival','arrival']].forEach(([id,key]) => {
  $(id).addEventListener('input', e => { current[key] = e.target.value; touch(); });
});
$('fFx').addEventListener('input', e => { current.fx = e.target.value; refresh(); touch(); });
$('fFx').addEventListener('blur',  e => { if(!num(current.fx)){ current.fx = FX_DEFAULT; e.target.value = show(FX_DEFAULT); refresh(); touch(); } });
$('fShip').addEventListener('input', e => { current.ship = e.target.value; refresh(); touch(); });
$('fKg').addEventListener('change', e => {
  current.useKg = e.target.checked;
  // sheets are priced by total, so the unit price is removed
  if(current.useKg) current.rows.forEach(r => { r.price = ''; });
  renderTable(); touch();
});

$('segCur').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  current.cur = b.dataset.v; setSeg($('segCur'), current.cur); renderTable(); touch();
});
$('segShip').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  current.shipCur = b.dataset.v; setSeg($('segShip'), current.shipCur); refresh(); touch();
});

/* row edits: qty/price -> total, total -> unit price */
$('rows').addEventListener('input', e => {
  const inp = e.target.closest('[data-f]'); if(!inp) return;
  const tr = inp.closest('tr'); const r = current.rows.find(x => x.id === tr.dataset.id); if(!r) return;
  const f = inp.dataset.f; r[f] = inp.value;
  const qty = num(r.qty);
  if(f === 'qty' || f === 'price'){
    if(f === 'qty' && r.price === '' && r.total !== '' && qty > 0){
      r.price = String(num(r.total) / qty);
      tr.querySelector('[data-f="price"]').value = show(r.price);
    } else if(r.price !== ''){
      r.total = String(qty * num(r.price));
      tr.querySelector('[data-f="total"]').value = show(r.total);
    }
  } else if(f === 'total' && !current.useKg){
    if(qty > 0){ r.price = r.total === '' ? '' : String(num(r.total) / qty); tr.querySelector('[data-f="price"]').value = show(r.price); }
  }
  refresh(); touch();
});
/* tidy long decimals once the user leaves a cell */
$('rows').addEventListener('focusout', e => {
  const inp = e.target.closest('[data-f="price"],[data-f="total"]'); if(!inp) return;
  const r = current.rows.find(x => x.id === inp.closest('tr').dataset.id);
  if(r) inp.value = show(r[inp.dataset.f]);
});
$('rows').addEventListener('click', e => {
  if(!e.target.closest('[data-del]')) return;
  const id = e.target.closest('tr').dataset.id;
  current.rows = current.rows.filter(x => x.id !== id);
  if(!current.rows.length) current.rows.push(newRow());
  renderTable(); touch();
});
/* Enter on the last row adds a new one */
$('rows').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const tr = e.target.closest('tr');
  if(tr && tr === $('rows').lastElementChild){ e.preventDefault(); addRow(); }
});
function addRow(){
  current.rows.push(newRow()); renderTable(); touch();
  $('rows').lastElementChild.querySelector('[data-f="item"]').focus();
}
$('btnAddRow').addEventListener('click', addRow);

/* ---------- Bills (PDF) & explanation (.txt) ---------- */
const kb = n => n >= 1048576 ? fmt(n/1048576, 1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const isTxt = f => f.type === 'text/plain' || /\.txt$/i.test(f.name);

function fileRow(meta, kind, slot, idx){
  const isT = kind === 'txt';
  return `<div class="file">
    <div class="ficon${isT?' txt':''}">${isT?'TXT':'PDF'}</div>
    <div class="fmeta"><div class="fname" title="${esc(meta.name)}">${esc(meta.name)}</div><div class="fsize">${kb(meta.size)}</div></div>
    ${isT ? `<button class="fbtn" data-dl-txt>Download</button>` : `<button class="fbtn" data-open="${esc(meta.id)}">View</button>`}
    <button class="x" data-remove="${slot}" data-idx="${idx ?? ''}" title="Remove file" aria-label="Remove ${esc(meta.name)}">&times;</button>
  </div>`;
}

function renderDocs(){
  const d = current.docs;
  $('supplierBill').innerHTML = d.supplier
    ? fileRow(d.supplier, 'pdf', 'supplier')
    : `<button class="attach" data-pick="pickSupplier">+ Attach supplier bill<small>PDF, or drop it here</small></button>`;

  $('shipperCount').textContent = `${d.shipper.length} of ${MAX_SHIPPER_BILLS} · PDF`;
  $('shipperBills').innerHTML = d.shipper.map((m,i) => fileRow(m, 'pdf', 'shipper', i)).join('') +
    (d.shipper.length < MAX_SHIPPER_BILLS
      ? `<button class="attach" data-pick="pickShipper">+ Attach shipper bill<small>PDF, or drop it here</small></button>` : '');

  $('stlCount').textContent = d.stl.length ? `${d.stl.length} PDF${d.stl.length>1?'s':''}` : 'PDF';
  $('stlFiles').innerHTML = d.stl.map((m,i) => fileRow(m, 'pdf', 'stl', i)).join('') +
    `<button class="attach" data-pick="pickStl">+ Attach STL payment PDFs<small>Select several at once, or drop them here</small></button>`;

  $('explain').innerHTML = d.explain
    ? fileRow(d.explain, 'txt', 'explain') +
      `<textarea class="explain-text" id="explainText" spellcheck="true" placeholder="Write the explanation here…" aria-label="Explanation text">${esc(d.explain.text)}</textarea>` +
      `<div class="explain-hint">Edit the text here. Changes save automatically; use Download to get the updated .txt file.</div>`
    : `<button class="attach" data-pick="pickExplain">+ Attach explanation<small>.txt file, or drop it here</small></button>` +
      `<button class="or-write" data-write>or write one here</button>`;
  growExplain();
}

/* textarea grows with its text so nothing is hidden (and it prints in full) */
function growExplain(){
  const t = $('explainText'); if(!t) return;
  t.style.height = 'auto'; t.style.height = Math.max(140, t.scrollHeight + 2) + 'px';
}

function downloadExplain(){
  const ex = current.docs.explain; if(!ex) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ex.text], {type:'text/plain;charset=utf-8'}));
  a.download = /\.txt$/i.test(ex.name) ? ex.name : ex.name + '.txt';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

async function addPdfs(slot, files){
  const s = current, d = s.docs;
  const pdfs = [...files].filter(isPdf);
  if(!pdfs.length){ toast('Please choose a PDF file'); return; }
  if(pdfs.length < files.length) toast('Only PDF files can be attached here');
  const room = slot === 'supplier' ? 1 : slot === 'stl' ? Infinity : MAX_SHIPPER_BILLS - d.shipper.length;
  if(room <= 0){ toast(`Up to ${MAX_SHIPPER_BILLS} shipper bills`); return; }
  const take = pdfs.slice(0, room);
  if(pdfs.length > room) toast(`Only ${MAX_SHIPPER_BILLS} shipper bills allowed, extra files skipped`);
  for(const f of take){
    const meta = {id:'f_'+uid(), name:f.name, size:f.size};
    try{ await FileStore.put(meta.id, f); }
    catch(e){ toast('Could not save that PDF on this device'); return; }
    if(slot === 'supplier') d.supplier = meta; else d[slot].push(meta);
  }
  if(s === current) renderDocs();
  touch();
}

async function addExplain(file){
  if(!isTxt(file)){ toast('Please choose a .txt file'); return; }
  const s = current;
  s.docs.explain = {id:'t_'+uid(), name:file.name, size:file.size, text: await file.text()};
  if(s === current) renderDocs();
  touch();
}

function removeDoc(slot, idx){
  const d = current.docs; let meta;
  if(slot === 'supplier'){ meta = d.supplier; d.supplier = null; }
  else if(slot === 'shipper' || slot === 'stl'){ meta = d[slot].splice(idx, 1)[0]; }
  else { d.explain = null; }
  if(meta && slot !== 'explain') FileStore.del(meta.id).catch(()=>{});
  renderDocs(); touch();
}

async function openPdf(id){
  // open the tab now so pop-up blockers allow it, then point it at the file
  const w = window.open('', '_blank');
  try{
    const blob = await FileStore.get(id);
    if(!blob) throw 0;
    const url = URL.createObjectURL(new Blob([blob], {type:'application/pdf'}));
    if(w) w.location.href = url; else location.href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ if(w) w.close(); toast('That file is missing on this device'); }
}

['supplierBill','shipperBills','stlFiles','explain'].forEach(boxId => {
  const box = $(boxId);
  box.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]'); if(pick){ $(pick.dataset.pick).click(); return; }
    const op = e.target.closest('[data-open]'); if(op){ openPdf(op.dataset.open); return; }
    if(e.target.closest('[data-dl-txt]')){ downloadExplain(); return; }
    if(e.target.closest('[data-write]')){
      const name = ((current.material || 'Shipment').replace(/[\\/:*?"<>|]+/g,' ').trim() || 'Shipment') + ' - explanation.txt';
      current.docs.explain = {id:'t_'+uid(), name, size:0, text:''};
      renderDocs(); touch(); $('explainText').focus(); return;
    }
    const rm = e.target.closest('[data-remove]'); if(rm) removeDoc(rm.dataset.remove, +rm.dataset.idx);
  });
  // drag & drop onto the box
  box.addEventListener('dragover', e => { e.preventDefault(); box.querySelector('.attach')?.classList.add('drag'); });
  box.addEventListener('dragleave', () => box.querySelector('.attach')?.classList.remove('drag'));
  box.addEventListener('drop', e => {
    e.preventDefault(); box.querySelector('.attach')?.classList.remove('drag');
    const files = e.dataTransfer.files; if(!files.length) return;
    if(boxId === 'explain'){ if(!current.docs.explain) addExplain(files[0]); else toast('Remove the current explanation first'); }
    else if(boxId === 'supplierBill'){ if(!current.docs.supplier) addPdfs('supplier', [files[0]]); else toast('Remove the current supplier bill first'); }
    else addPdfs(boxId === 'stlFiles' ? 'stl' : 'shipper', files);
  });
});
$('explain').addEventListener('input', e => {
  if(e.target.id !== 'explainText' || !current.docs.explain) return;
  const ex = current.docs.explain;
  ex.text = e.target.value;
  ex.size = new Blob([ex.text]).size;
  const sz = $('explain').querySelector('.fsize'); if(sz) sz.textContent = kb(ex.size);
  growExplain(); touch();
});
$('pickStl').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if(f.length) addPdfs('stl', f); });
$('pickSupplier').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if(f.length) addPdfs('supplier', f); });
$('pickShipper').addEventListener('change',  e => { const f = [...e.target.files]; e.target.value = ''; if(f.length) addPdfs('shipper', f); });
$('pickExplain').addEventListener('change',  e => { const f = e.target.files[0]; e.target.value = ''; if(f) addExplain(f); });
// a file dropped outside the drop boxes should not navigate away
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

function docIds(s){ const d = s.docs || {}; return [d.supplier, ...(d.shipper||[]), ...(d.stl||[])].filter(Boolean).map(m => m.id); }

/* delete: tap twice */
let delT;
function disarmDelete(){ clearTimeout(delT); const b = $('btnDelete'); b.classList.remove('arm'); b.textContent = 'Delete shipment'; }
$('btnDelete').addEventListener('click', () => {
  const b = $('btnDelete');
  if(!b.classList.contains('arm')){
    b.classList.add('arm'); b.textContent = 'Tap again to delete';
    delT = setTimeout(disarmDelete, 3500); return;
  }
  docIds(current).forEach(id => FileStore.del(id).catch(()=>{}));
  DB = DB.filter(s => s !== current); Store.save(DB);
  current = null; toast('Shipment deleted');
  location.hash = '';
});
$('btnPrint').addEventListener('click', () => window.print());
$('btnBack').addEventListener('click', () => { location.hash = ''; });

/* ---------- Backup / restore ---------- */
const toDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

/* the backup carries the PDF bills too, so a restore on another PC is complete */
$('btnBackup').addEventListener('click', async () => {
  toast('Preparing backup…');
  const files = {}; let missing = 0;
  for(const s of DB) for(const id of docIds(s)){
    try{ const b = await FileStore.get(id); if(b) files[id] = await toDataURL(b); else missing++; }
    catch(e){ missing++; }
  }
  const blob = new Blob([JSON.stringify({app:'asa-stock-costing', version:2, saved:new Date().toISOString(), shipments:DB, files})], {type:'application/json'});
  if(missing) toast(`${missing} bill file${missing>1?'s were':' was'} missing and not included`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ASA Stock Costing backup ${today()}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});
$('btnRestore').addEventListener('click', () => $('fileRestore').click());
$('fileRestore').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.shipments;
    if(!Array.isArray(list)) throw 0;
    const files = (data && data.files) || {};
    for(const [id, url] of Object.entries(files)){
      try{ await FileStore.put(id, await (await fetch(url)).blob()); }catch(e){}
    }
    let added = 0, updated = 0;
    list.forEach(s => {
      if(!s || !s.id || !Array.isArray(s.rows)) return;
      if(!s.docs) s.docs = {supplier:null, shipper:[], explain:null};
      if(!s.docs.stl) s.docs.stl = [];
      const i = DB.findIndex(x => x.id === s.id);
      if(i < 0){ DB.push(s); added++; }
      else if((s.updated||0) >= (DB[i].updated||0)){ DB[i] = s; updated++; }
    });
    Store.save(DB); route();
    toast(`Restored: ${added} new, ${updated} updated`);
  }catch(err){ toast('That file is not an ASA Stock Costing backup'); }
});

/* ---------- Routing ---------- */
function route(){
  // drop a shipment that was opened but never filled in
  if(current && isBlank(current)){ DB = DB.filter(s => s !== current); Store.save(DB); }
  const m = location.hash.match(/^#\/s\/(.+)$/);
  const s = m && DB.find(x => x.id === m[1]);
  if(s){
    $('viewList').hidden = true; $('viewDetail').hidden = false;
    document.title = (s.material || 'Shipment') + ' · ASA Stock Costing';
    openDetail(s); window.scrollTo(0,0);
  } else {
    current = null;
    $('viewDetail').hidden = true; $('viewList').hidden = false;
    document.title = 'ASA Stock Costing';
    renderList();
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { clearTimeout(saveT); Store.save(DB); });
route();
</script>
</body>
